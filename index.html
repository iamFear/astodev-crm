<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Astodev CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div id="auth-root" class="auth-wrap" hidden></div>

  <div id="app-root" hidden>
    <div class="app">
      <header class="top">
        <h1 class="brand">Astodev <span>CRM</span></h1>
        <nav class="nav" aria-label="Vistas">
          <a href="#hoy" id="nav-hoy">Hoy</a>
          <a href="#pipeline" id="nav-pipeline">Pipeline</a>
          <a href="#leads" id="nav-leads">Leads</a>
          <a href="#metricas" id="nav-metricas">Métricas</a>
        </nav>
        <div class="tools">
          <button class="btn sm" id="btn-plantillas" type="button">Plantillas</button>
          <button class="btn sm ghost" id="btn-theme" type="button" aria-label="Cambiar tema">Tema</button>
          <button class="btn sm ghost" id="btn-logout" type="button">Salir</button>
        </div>
      </header>
      <main id="view" aria-live="off"></main>
    </div>

    <div id="overlay" hidden>
      <div class="backdrop" id="backdrop"></div>
      <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
        <div class="drawer-h">
          <h2 id="drawer-title"></h2>
          <button class="btn sm" id="drawer-close" type="button">Cerrar</button>
        </div>
        <div class="drawer-b" id="drawer-body"></div>
        <div class="drawer-f" id="drawer-foot"></div>
      </aside>
    </div>
    <div id="toasts" role="status" aria-live="polite"></div>
    <div id="fallback" class="fallback" hidden></div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
